syntax = "proto3";
package rhythmeta.backup.v1;
option java_package = "org.rhythmeta.backup.proto";
option java_outer_classname = "BackupProtocol";
option swift_prefix = "RHY";

// Logical personal-data snapshot. Gzip this message once; hash compressed bytes.
// IDs and chart keys are stable application IDs. Timestamps are Unix milliseconds.
// Zero optional timestamps and empty optional strings mean absent. Never include tokens.
message Snapshot {
  string magic = 1; // RHYTHMETA_BACKUP
  uint32 format_version = 2; // 1
  string game = 3; // maimaid or chunithmd
  int64 created_at = 4;
  string client_version = 5;
  repeated Profile profiles = 6;
  repeated Score scores = 7;
  repeated PlayRecord play_records = 8;
  repeated Collection collections = 9;
  repeated CollectionItem collection_items = 10;
  repeated string favorite_song_ids = 11;
  repeated Setting settings = 12;
}
message Profile {
  string id = 1;
  string name = 2;
  string server = 3;
  bytes avatar = 4;
  string avatar_url = 5;
  bool active = 6;
  int64 created_at = 7;
  string df_username = 8;
  int32 player_rating = 9;
  string plate = 10;
  int64 last_import_df = 11;
  int64 last_import_lxns = 12;
  int32 b35_count = 13;
  int32 b15_count = 14;
  int32 b35_rec_limit = 15;
  int32 b15_rec_limit = 16;
  string title = 17;
}
message Score {
  string profile_id = 1;
  string chart_key = 2;
  double achievement = 3;
  string rank = 4;
  int32 dx_score = 5;
  string fc = 6;
  string fs = 7;
  int64 achieved_at = 8;
  int32 score = 9;
  string clear = 10;
  string song_id = 11;
}
message PlayRecord {
  string id = 1;
  Score result = 2;
}
message Collection {
  string id = 1;
  string name = 2;
  int32 sort_index = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}
message CollectionItem {
  string id = 1;
  string collection_id = 2;
  string song_id = 3;
  string chart_type = 4;
  string difficulty = 5;
  int32 position = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}
// Namespaced platform settings remain portable as opaque values to the other OS.
// Only an explicit allowlist of personal settings may be imported or exported.
message Setting {
  string key = 1;
  string kind = 2; // string, int, long, double, float, bool, strings, bytes
  string string_value = 3;
  int64 integer_value = 4;
  double double_value = 5;
  bool bool_value = 6;
  repeated string string_values = 7;
  bytes bytes_value = 8;
}
