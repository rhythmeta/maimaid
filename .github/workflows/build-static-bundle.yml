name: Build static bundle

"on":
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: build-static-bundle
  cancel-in-progress: false

jobs:
  build-static-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both caches use the same convention: a run-unique key so the restore can never hit it
      # exactly, plus a prefix in restore-keys that picks up the newest surviving archive. The
      # save steps reuse that key, so each cache is written at most once per run.
      - name: Restore static image cache
        uses: actions/cache/restore@v4
        with:
          path: |
            static-worker/public/covers
            static-worker/public/lxns-icons
          key: static-images-${{ runner.os }}-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            static-images-${{ runner.os }}-${{ github.repository }}-

      - name: Restore chart asset cache
        uses: actions/cache/restore@v4
        with:
          path: |
            static-worker/public/chart-assets
            static-worker/.chart-assets-cache
          key: static-chart-assets-${{ runner.os }}-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            static-chart-assets-${{ runner.os }}-${{ github.repository }}-

      # The image cache is only rewritten when its contents change; without this guard an
      # unchanged set of jackets uploads ~180 MB on every scheduled run and crowds out the
      # much larger chart-asset cache. The digest covers path and size, so new jackets always
      # change it while an in-place replacement of identical size does not.
      - name: Fingerprint restored images
        id: images-restored
        run: |
          set -euo pipefail
          digest=$( (find static-worker/public/covers static-worker/public/lxns-icons -type f -printf '%p %s\n' 2>/dev/null || true) | sort | sha256sum | cut -d ' ' -f 1 )
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Mirror chart assets
        id: mirror-chart-assets
        run: pnpm --dir static-builder run mirror:chart-assets

      - name: Generate static assets
        working-directory: static-builder
        env:
          MAIMAID_STATIC_ASSETS_URL: ${{ secrets.MAIMAID_STATIC_ASSETS_URL }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          : "${MAIMAID_STATIC_ASSETS_URL:?Missing GitHub Secret MAIMAID_STATIC_ASSETS_URL}"
          pnpm run build

      - name: Verify chart assets
        run: pnpm --dir static-builder run verify:chart-assets

      - name: Fingerprint built images
        id: images-built
        run: |
          set -euo pipefail
          digest=$( (find static-worker/public/covers static-worker/public/lxns-icons -type f -printf '%p %s\n' 2>/dev/null || true) | sort | sha256sum | cut -d ' ' -f 1 )
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Save static image cache
        if: steps.images-restored.outputs.digest != steps.images-built.outputs.digest
        uses: actions/cache/save@v4
        with:
          path: |
            static-worker/public/covers
            static-worker/public/lxns-icons
          key: static-images-${{ runner.os }}-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save chart asset cache
        if: steps.mirror-chart-assets.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            static-worker/public/chart-assets
            static-worker/.chart-assets-cache
          key: static-chart-assets-${{ runner.os }}-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy static assets Worker
        working-directory: static-builder
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing GitHub Secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing GitHub Secret CLOUDFLARE_ACCOUNT_ID}"
          pnpm exec wrangler deploy --config ../static-worker/wrangler.jsonc

