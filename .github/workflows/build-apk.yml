name: Build maimaid APK

"on":
  push:
    paths:
      - android/**
      - scripts/build-number.sh
      - scripts/android-ci-update.mjs
      - scripts/android-ci-update.test.mjs
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build number
        run: |
          echo "MAIMAID_BUILD_NUMBER=$(scripts/build-number.sh)" >> "$GITHUB_ENV"
          echo "MAIMAID_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test update publication
        run: node --test scripts/android-ci-update.test.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: >-
          sdkmanager
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing secret ANDROID_KEY_PASSWORD}"
          keystore_path="${RUNNER_TEMP}/rhythmeta-release.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          keytool -list \
            -storetype PKCS12 \
            -keystore "${keystore_path}" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "${ANDROID_KEY_ALIAS}" > /dev/null
          echo "ANDROID_KEYSTORE_PATH=${keystore_path}" >> "${GITHUB_ENV}"

      - name: Check SGWCMAID configuration
        env:
          MAIMAID_SGWCMAID: ${{ secrets.MAIMAID_SGWCMAID }}
        run: |
          if [ -z "${MAIMAID_SGWCMAID}" ]; then
            echo "::warning::MAIMAID_SGWCMAID is not set; this APK will ship without SGWCMAID import endpoints."
          else
            echo "SGWCMAID configuration provided."
          fi

      - name: Prepare SGWCMAID cabinet catalog
        env:
          MAIMAID_KEYCHIPS_GZIP: ${{ secrets.MAIMAID_KEYCHIPS_GZIP }}
        run: |
          if [ -n "${MAIMAID_KEYCHIPS_GZIP:-}" ]; then
            keychips_path="${RUNNER_TEMP}/keychips.json"
            printf '%s' "${MAIMAID_KEYCHIPS_GZIP}" | base64 --decode | gunzip > "${keychips_path}"
            test -s "${keychips_path}"
            echo "MAIMAID_KEYCHIPS_FILE=${keychips_path}" >> "${GITHUB_ENV}"
            echo "Configured the SGWCMAID cabinet catalog."
          else
            echo "::warning::MAIMAID_KEYCHIPS_GZIP is not set; this APK will fall back to a single keychip."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAIMAID_SGWCMAID: ${{ secrets.MAIMAID_SGWCMAID }}
        run: >-
          ./gradlew :app:assembleRelease
          -PMAIMAID_SPLIT_RELEASE_APKS=true
          --warning-mode all

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          for apk in android/app/build/outputs/apk/release/*.apk; do
            "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify \
              --verbose \
              --print-certs \
              "${apk}"
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: maimaid-apk-arm64-v8a-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: maimaid-apk-armeabi-v7a-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: maimaid-apk-x86_64-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: maimaid-apk-x86-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: maimaid-r8-mapping-${{ github.sha }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Setup pnpm
        if: github.ref == 'refs/heads/main'
        uses: pnpm/action-setup@v4

      - name: Install publishing dependencies
        if: github.ref == 'refs/heads/main'
        run: pnpm install --frozen-lockfile

      - name: Publish APKs and update manifest to R2
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing secret CLOUDFLARE_ACCOUNT_ID}"
          node scripts/android-ci-update.mjs
