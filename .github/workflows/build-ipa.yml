name: Build maimaid IPA

"on":
  push:
    paths:
      - ios/**
      - scripts/build-number.sh
      - scripts/ios-sgwcmaid-settings.py
      - scripts/ios-keychips-resource.sh
      - .github/workflows/build-ipa.yml
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build number
        run: echo "MAIMAID_BUILD_NUMBER=$(scripts/build-number.sh)" >> "$GITHUB_ENV"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ios/maimaid.xcodeproj \
            -scheme maimaid \
            -resolvePackageDependencies

      - name: Archive app (unsigned)
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/maimaid.xcarchive
          MAIMAID_API_URL: ${{ secrets.MAIMAID_API_URL }}
          MAIMAID_AUTH_URL: https://dash.rhythmeta.org
          MAIMAID_SGWCMAID: ${{ secrets.MAIMAID_SGWCMAID }}
          MAIMAID_KEYCHIPS_GZIP: ${{ secrets.MAIMAID_KEYCHIPS_GZIP }}
        run: |
          set -euo pipefail
          mkdir -p build
          LOG_PATH="$PWD/build/archive.log"
          RESULT_BUNDLE_PATH="$PWD/build/maimaid.xcresult"
          : "${MAIMAID_API_URL:?Missing GitHub Secret MAIMAID_API_URL}"
          : "${MAIMAID_AUTH_URL:?Missing MAIMAID_AUTH_URL}"
          echo "Configuring backend API and auth endpoints for the IPA archive."

          SGWCMAID_XCCONFIG="ios/Config/Secrets.xcconfig"
          if [ -n "${MAIMAID_SGWCMAID:-}" ]; then
            if ! python3 scripts/ios-sgwcmaid-settings.py --format xcconfig > "$SGWCMAID_XCCONFIG"; then
              echo "::error::Could not parse the MAIMAID_SGWCMAID secret."
              rm -f "$SGWCMAID_XCCONFIG"
              exit 1
            fi
            SETTINGS_COUNT="$(grep -c '^SGWCMAID_' "$SGWCMAID_XCCONFIG" || true)"
            if [ "$SETTINGS_COUNT" -eq 0 ]; then
              echo "::error::MAIMAID_SGWCMAID produced no SGWCMAID settings."
              rm -f "$SGWCMAID_XCCONFIG"
              exit 1
            fi
            echo "Configuring SGWCMAID import for the IPA archive ($SETTINGS_COUNT settings)."
            trap 'rm -f "$SGWCMAID_XCCONFIG"' EXIT
          else
            echo "::warning::MAIMAID_SGWCMAID is not set; this IPA will ship without SGWCMAID import endpoints."
          fi

          if [ -n "${MAIMAID_KEYCHIPS_GZIP:-}" ]; then
            export MAIMAID_KEYCHIPS_FILE="$RUNNER_TEMP/keychips.json"
            printf '%s' "$MAIMAID_KEYCHIPS_GZIP" | base64 --decode | gunzip > "$MAIMAID_KEYCHIPS_FILE"
            test -s "$MAIMAID_KEYCHIPS_FILE"
            echo "Configured the SGWCMAID cabinet catalog."
          else
            echo "::warning::MAIMAID_KEYCHIPS_GZIP is not set; this IPA will fall back to the single keychip."
          fi

          if ! xcodebuild \
            -project ios/maimaid.xcodeproj \
            -scheme maimaid \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$MAIMAID_BUILD_NUMBER" \
            BACKEND_URL="$MAIMAID_API_URL" \
            BACKEND_AUTH_URL="$MAIMAID_AUTH_URL" \
            archive \
            -archivePath "$ARCHIVE_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" 2>&1 | tee "$LOG_PATH"; then
            echo "Archive failed. Extracting error lines:"
            grep -nE "error:|fatal error:|FAILED|failure" "$LOG_PATH" || true
            exit 1
          fi
          APP_PATH="$ARCHIVE_PATH/Products/Applications/maimaid.app"
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/maimaid.app
          cd build
          /usr/bin/zip -qry maimaid.ipa Payload
          ls -lh maimaid.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: maimaid-ipa-${{ github.sha }}
          path: build/maimaid.ipa
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maimaid-build-diagnostics-${{ github.sha }}
          path: |
            build/archive.log
            build/maimaid.xcresult
          if-no-files-found: warn
